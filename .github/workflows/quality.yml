name: Mind Forge quality checks

on:
  push:
    branches: [main, mind-forge-omega-v7-foundation, mind-forge-omega-v9-security-ux]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mind-forge-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend, content and accessibility structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check question-bank.js
          node --check portuguese-forge.js
          node --check scripts/core/question-context.js
          node --check english-forge.js
          node --check logic-forge.js
          node --check platform-enhancements.js
          node --check scripts/site.js
          node --check worker/src/index.js
          find scripts worker -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Audit static HTML and local resources
        run: |
          python tools/audit_site.py
      - name: Test public question stimuli and Portuguese Forge
        run: node tools/test-site-question-context.cjs
      - name: Test storage migration and unified backup
        run: node tools/test-platform-enhancements.cjs
      - name: Test Logic Forge curriculum and backup
        run: node tools/test-logic-forge.cjs
      - name: Test Tutor Worker boundaries and rate limiting
        run: node tools/test-worker.cjs
      - name: Test existing learning modules
        run: node tools/run-tests.cjs
      - name: Export and audit question bank
        run: |
          node tools/export-question-bank.cjs /tmp/mind-forge-bank.json
          python tools/audit_questions.py /tmp/mind-forge-bank.json

  backend:
    name: Python Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run API tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests

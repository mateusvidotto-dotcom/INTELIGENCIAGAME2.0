[project]
name = "mind-forge-omega-core"
version = "0.2.0"
description = "Motor pedagógico local do MIND FORGE OMEGA"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.7,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
